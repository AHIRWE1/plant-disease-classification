services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PLANT_DISEASE_ADMIN_TOKEN: ${PLANT_DISEASE_ADMIN_TOKEN:?Set PLANT_DISEASE_ADMIN_TOKEN in .env}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      PLANT_DISEASE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
